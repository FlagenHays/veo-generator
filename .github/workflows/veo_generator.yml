name: Veo Video Generator

on:
  repository_dispatch:
    types: [trigger_veo_generation]

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install google-genai requests

      - name: Run Python Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Valeurs passées par variables d'environnement : JAMAIS interpolées dans le script shell
          # (sinon un prompt contenant " ou $( ) exécuterait du code avec accès aux secrets).
          VEO_PROMPT: ${{ github.event.client_payload.prompt }}
          VEO_IMAGES: ${{ toJson(github.event.client_payload.images) }}
        run: |
          python scripts/generate_veo.py "$GEMINI_API_KEY" "$VEO_PROMPT" "$VEO_IMAGES"

      - name: Verify Video File
        run: |
          if [ ! -f final_video.mp4 ]; then
            echo "ERREUR : final_video.mp4 introuvable"
            exit 1
          fi
          SIZE=$(stat -c%s "final_video.mp4")
          echo "Taille vidéo : ${SIZE} bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERREUR : fichier trop petit"
            exit 1
          fi

      - name: Send Video Back to Hostinger
        if: success()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          VID_UUID: ${{ github.event.client_payload.uuid }}
          VID_CAMPAGNE: ${{ github.event.client_payload.campagne_id }}
        run: |
          case "$WEBHOOK_URL" in https://igrise.com/*|https://www.igrise.com/*) ;; *) echo "webhook_url refusée"; exit 1;; esac
          curl -X POST "$WEBHOOK_URL" \
            -H "X-Webhook-Token: $WEBHOOK_SECRET" \
            -F "video=@final_video.mp4" \
            -F "uuid=$VID_UUID" \
            -F "campagne_id=$VID_CAMPAGNE" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10

      - name: Notify Failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          VID_UUID: ${{ github.event.client_payload.uuid }}
          VID_CAMPAGNE: ${{ github.event.client_payload.campagne_id }}
        run: |
          case "$WEBHOOK_URL" in https://igrise.com/*|https://www.igrise.com/*) ;; *) echo "webhook_url refusée"; exit 0;; esac
          curl -X POST "$WEBHOOK_URL" \
            -H "X-Webhook-Token: $WEBHOOK_SECRET" \
            -F "error=generation_failed" \
            -F "uuid=$VID_UUID" \
            -F "campagne_id=$VID_CAMPAGNE" \
            --max-time 30 || true
